name: PHP ellenőrzés

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}

      - name: Szintaxis ellenőrzés
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
